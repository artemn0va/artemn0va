name: Update profile cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - tests/test_update_profile.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check card generation
        run: python3 -m unittest discover -s tests

      - name: Refresh SVG cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Save successful updates
        if: ${{ !cancelled() }}
        run: |
          git add assets/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile cards"
          git push origin HEAD:main
