                    values='m0,30 h0 ; m0,30 h1000 ; m0,30 h1000 ; m0,30 h0' keyTimes='0;0.61538461538462;0.84615384615385;1' />
                    </path>
    <text font-family='"monospace", monospace' fill='#00bfbf' font-size='35'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
