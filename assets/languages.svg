<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="descId">
        <title id="titleId" />
        <desc id="descId" />
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #00bfbf;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #c9d1d9;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          * { animation-duration: 0s !important; animation-delay: 0s !important; }
        </style>

        

        <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="494" fill="#0d1117" stroke-opacity="0" />

        
      <g data-testid="card-title" transform="translate(25, 35)">
        <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
    </g>
      </g>
    

        <g data-testid="main-card-body" transform="translate(0, 55)">
          
    <svg data-testid="lang-items" x="25">
      
  
      <mask id="rect-mask">
          <rect x="0" y="0" width="445" height="8" fill="white" rx="5" />
        </mask>
        
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0" y="0" width="327.19" height="8" fill="#3572A5" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="327.19" y="0" width="52.01" height="8" fill="#3178c6" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="379.2" y="0" width="20.84" height="8" fill="#DA5B0B" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="400.03999999999996" y="0" width="20.63" height="8" fill="#f1e05a" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="420.66999999999996" y="0" width="18.46" height="8" fill="#c6538c" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="429.12999999999994" y="0" width="18.14" height="8" fill="#663399" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="437.2699999999999" y="0" width="14.09" height="8" fill="#41b883" />
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="441.3599999999999" y="0" width="13.64" height="8" fill="#e34c26" />
      
      
    <g transform="translate(0, 25)">
      <g transform="translate(0, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Python 73.53%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
